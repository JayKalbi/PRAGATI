[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pragati"
version = "0.1.0"
description = "PRAGATI: Urban flood forecasting and reliability-aware decision support"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PRAGATI Research Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "h3>=3.7.6",
    "geopandas>=0.13.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
